---
layout: default
title: Blogger Templates
---

<h2 class="section-title">Featured Blogger Themes</h2>

<div class="theme-grid">
    <!-- Jekyll loop starts here: Maximum 6 post dikhayega homepage par -->
    {% for post in site.posts limit:6 %}
    <div class="card">
        <img src="{{ post.image }}" alt="{{ post.title }}" class="card-img">
        <div class="card-body">
            <a href="{{ post.url | relative_url }}"><h3 class="theme-title">{{ post.title }}</h3></a>
            <div class="btn-group">
                <a href="{{ post.preview_link }}" class="btn btn-preview" target="_blank"><i class="fa-solid fa-eye"></i> Preview</a>
                <a href="{{ post.download_link }}" class="btn btn-download" target="_blank"><i class="fa-solid fa-download"></i> Download</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<div class="view-more-container">
    <a href="{{ '/themes.html' | relative_url }}" class="btn-view-more">View All Themes <i class="fa-solid fa-arrow-right"></i></a>
</div>
