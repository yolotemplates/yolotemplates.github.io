---
layout: default
title: All Templates Archive
permalink: /archive/
---
<div class="archive-container">
  <!-- Jekyll ka loop jo har ek tag (category) se gujarega -->
  {% for tag in site.tags %}
    {% assign tag_name = tag[0] %}
    {% assign tag_posts = tag[1] %}
    
    <!-- ID assign karna taaki URL se direct yahan jump kar sake -->
    <h2 id="{{ tag_name }}">{{ tag_name | capitalize }} Templates</h2>
    
    <ul>
      {% for post in tag_posts %}
        <li><a href="{{ post.url }}">{{ post.title }}</a></li>
      {% endfor %}
    </ul>
    <hr>
  {% endfor %}
</div>
