<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ site.title }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CSS Variables for Light/Dark Mode --- */
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333333;
            --nav-bg: #ffffff;
            --nav-shadow: rgba(0,0,0,0.05);
            --logo-color: #2c3e50;
            --primary-color: #3498db;
            --card-bg: #ffffff;
            --border-color: #eeeeee;
            --card-text: #2c3e50;
            --post-bg: #ffffff;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --nav-bg: #1e1e1e;
            --nav-shadow: rgba(255,255,255,0.02);
            --logo-color: #ffffff;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --card-text: #e0e0e0;
            --post-bg: #1e1e1e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; }

        /* --- Navbar --- */
        .navbar { background: var(--nav-bg); box-shadow: 0 4px 15px var(--nav-shadow); position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 24px; font-weight: 700; color: var(--logo-color); text-decoration: none; }
        .logo span { color: var(--primary-color); }
        .nav-center a { text-decoration: none; color: var(--text-color); font-weight: 600; margin-right: 25px; }

        /* --- Single Post Layout Container --- */
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .single-post-wrapper { display: flex; flex-wrap: wrap; gap: 30px; align-items: flex-start; }
        
        .post-main { 
            flex: 1 1 65%; 
            background: var(--post-bg); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px var(--nav-shadow); 
            border: 1px solid var(--border-color);
        }
        
        .post-title { font-size: 32px; color: var(--logo-color); margin-bottom: 20px; font-weight: bold; }
        .post-featured-image { width: 100%; max-height: 400px; border-radius: 8px; margin-bottom: 15px; object-fit: cover; border: 1px solid var(--border-color); }
        
        /* --- Preview Button & Share Bar (Image ke theek niche) --- */
        .post-action-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin: 15px 0 25px 0; 
            flex-wrap: wrap; 
            gap: 15px; 
        }
        
        /* Index page jaisa exact .btn-preview style */
        .btn-post-preview { 
            text-decoration: none; 
            padding: 10px 20px; 
            border-radius: 8px; 
            font-weight: 600; 
            font-size: 14px; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            background: #f1f3f5; 
            color: #495057; 
            border: 1px solid var(--border-color); 
            transition: background 0.3s, color 0.3s; 
        }
        .btn-post-preview:hover { background: #e2e6ea; color: #212529; }
        
        body.dark-mode .btn-post-preview { background: #2a2a2a; color: #e0e0e0; border-color: #444444; }
        body.dark-mode .btn-post-preview:hover { background: #333333; color: #ffffff; }

        /* Right side Share Section */
        .share-container { display: flex; align-items: center; gap: 10px; }
        .share-label { font-weight: 600; font-size: 14px; color: var(--text-color); }
        .share-icons { display: flex; gap: 8px; }
        .share-btn { 
            width: 36px; 
            height: 36px; 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--text-color); 
            text-decoration: none; 
            font-size: 15px; 
            transition: all 0.2s ease; 
        }
        .share-btn:hover { background: var(--primary-color); color: #ffffff; border-color: var(--primary-color); transform: translateY(-2px); }

        .post-body { font-size: 16px; line-height: 1.8; color: var(--text-color); }
        
        /* Sidebar (agar ho) */
        .post-sidebar { flex: 1 1 30%; }

        @media (max-width: 768px) {
            .single-post-wrapper { flex-direction: column; }
            .post-main, .post-sidebar { flex: 1 1 100%; }
            .post-action-bar { flex-direction: column; align-items: stretch; }
            .share-container { justify-content: space-between; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ '/' | relative_url }}" class="logo">Yolo<span>Templates</span></a>
            <div class="nav-center">
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="{{ '/themes.html' | relative_url }}">All Themes</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="single-post-wrapper">
            
            <!-- Left Main Content Area -->
            <div class="post-main">
                <h1 class="post-title">{{ page.title }}</h1>
                
                {% if page.image %}
                    <img src="{{ page.image }}" alt="{{ page.title }}" class="post-featured-image">
                {% endif %}

                <!-- 🔥 IMAGE KE THEEK NICHE: Preview Button (Left) & Share Icons (Right) -->
                <div class="post-action-bar">
                    <a href="{{ page.preview_link }}" class="btn-post-preview" target="_blank">
                        <i class="fa-solid fa-eye"></i> Preview Link
                    </a>
                    
                    <div class="share-container">
                        <span class="share-label">Share on:</span>
                        <div class="share-icons">
                            <a href="https://api.whatsapp.com/send?text={{ page.title | url_encode }}%20{{ site.url }}{{ page.url }}" target="_blank" class="share-btn" title="Share on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u={{ site.url }}{{ page.url }}" target="_blank" class="share-btn" title="Share on Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                            <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}&url={{ site.url }}{{ page.url }}" target="_blank" class="share-btn" title="Share on X"><i class="fa-brands fa-x-twitter"></i></a>
                            <a href="mailto:?subject={{ page.title | url_encode }}&body=Check out this theme: {{ site.url }}{{ page.url }}" class="share-btn" title="Share More"><i class="fa-solid fa-share-nodes"></i></a>
                        </div>
                    </div>
                </div>

                <!-- Post Body Content -->
                <div class="post-body">
                    {{ content }}
                </div>
            </div>

            <!-- Right Sidebar Area (Agar ho) -->
            <div class="post-sidebar">
                <!-- Sidebar pricing card ya checkout modal yahan aayega -->
            </div>

        </div>
    </div>

</body>
</html>
