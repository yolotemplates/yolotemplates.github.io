<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.name }} - {{ page.title }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        nav { background: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 700; color: #2c3e50; text-decoration: none; }
        .logo span { color: #3498db; }
        .nav-links a { text-decoration: none; color: #2c3e50; font-weight: 600; margin-left: 20px; transition: color 0.3s; }
        .nav-links a:hover { color: #3498db; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .section-title { text-align: center; margin-bottom: 30px; font-size: 28px; color: #2c3e50; }
        
        /* Grid Layout & Cards */
        .theme-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .card { background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: transform 0.3s ease; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); }
        .card-img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 20px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .theme-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: #2c3e50; text-decoration: none;}
        .btn-group { display: flex; gap: 10px; }
        .btn { text-decoration: none; padding: 10px 15px; border-radius: 8px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; flex: 1; }
        .btn-preview { background: #f1f3f5; color: #495057; }
        .btn-preview:hover { background: #e2e6ea; }
        .btn-download { background: #3498db; color: #ffffff; }
        .btn-download:hover { background: #2980b9; }
        .view-more-container { text-align: center; margin-top: 40px; }
        .btn-view-more { display: inline-flex; align-items: center; gap: 8px; background: #2c3e50; color: #ffffff; padding: 12px 30px; border-radius: 25px; text-decoration: none; font-weight: 600; }
        
        /* Single Post Style */
        .post-content { background: #fff; padding: 30px; border-radius: 12px; margin-top: 20px; line-height: 1.6; }
        .post-content img { max-width: 100%; border-radius: 8px; margin: 15px 0; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ '/' | relative_url }}" class="logo">Yolo<span>Templates</span></a>
        <div class="nav-links">
            <a href="{{ '/' | relative_url }}"><i class="fa-solid fa-house"></i> Home</a>
        </div>
    </nav>

    <div class="container">
        <!-- Yahan baaki pages ka content aayega -->
        {{ content }}
    </div>
</body>
</html>
