---
layout: default
---
<div class="category-page">
  <h1>{{ page.title }}</h1>
  
  <div class="post-grid">
    <!-- Liquid loop jo sirf current page ke tag wale posts layega -->
    {% for post in site.tags[page.category_tag] %}
      <div class="post-card">
        <img src="{{ post.image }}" alt="{{ post.title }}">
        <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
      </div>
    {% else %}
      <p>No templates found in this category yet.</p>
    {% endfor %}
  </div>
</div>
